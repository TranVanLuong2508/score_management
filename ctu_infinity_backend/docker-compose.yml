services:
  postgres:
    image: postgres:18
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: CTU_Infinity
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8.2.3
    container_name: redis-db
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    command: ['redis-server', '--appendonly', 'yes']
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb_server
    ports:
      - "8000:8000"
    environment:
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma
    restart: always
volumes:
  pgdata:
  redisdata:
  chroma_data:

